services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: power-market-frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:8000
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - portal_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: power-market-backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      DB_PATH: /app/runtime/power_market.db
      DATA_DIR: /app/data
    volumes:
      - backend_runtime:/app/runtime
      - backend_uploads:/app/data
    networks:
      - portal_net

  nginx:
    image: nginx:1.27-alpine
    container_name: power-market-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - portal_net

networks:
  portal_net:
    driver: bridge

volumes:
  backend_runtime:
  backend_uploads:
